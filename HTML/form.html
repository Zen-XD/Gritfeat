<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML forms</title>
    <link rel="stylesheet" href="../CSS/form.css" />
</head>

<body>
    <h1>Job Application Portal</h1>
    <form>
        <section id="info">
            <p>Personal Information</p>

            <div class="p_info">
                <label for="first_name">Full Name</label>
                <input type="text" name="username" id="first_name" placeholder="Enter your name" />
            </div>

            <div class="p_info">
                <label for="email">Email</label>
                <input type="email" name="email" id="email" placeholder="Enter your email" />
            </div>

            <div class="p_info">
                <label for="birthday">Date of Birth</label>
                <input type="date" id="birthday" name="birthday" />
            </div>

            <div class="p_info">
                <label for="num">Phone Number</label>
                <input type="text" id="num" name="phone" placeholder="Enter your phone number" />
            </div>

            <div id="address" class="p_info">
                <label for="address">Address</label>
                <input type="text" id="address" name="address" placeholder="Enter your address" />
            </div>
        </section>

        <section id="professional">
            <p>Professional Information</p>
            <label class="bold">Experience</label>
            <div class="box">
                <label>
                    <input type="radio" name="experience" /> Beginner
                </label>
                <label>
                    <input type="radio" name="experience" /> Intermediate
                </label>
                <label>
                    <input type="radio" name="experience" /> Expert
                </label>
            </div>

            <label class="bold">Skills</label>
            <div class="box">
                <label> <input type="checkbox" /> HTML </label>
                <label> <input type="checkbox" /> CSS </label>
                <label> <input type="checkbox" /> JavaScript </label>
                <label> <input type="checkbox" /> React </label>
                <label> <input type="checkbox" /> Others </label>
            </div>

            <label for="comment" class="bold">Why should we hire you?</label>
            <textarea name="comment" placeholder="Hello">Write your comment</textarea>
        </section>

        <input type="button" value="Submit" id="submit" />
    </form>
</body>

</html>
